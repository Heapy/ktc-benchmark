name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            native: linux
            cli: ./kotlin
          - os: macos-latest
            native: macos
            cli: ./kotlin
          - os: windows-latest
            native: windows
            cli: ./kotlin.bat
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Heapy/setup-ktc@cc63216665ce07ce0709fe52ef4a4b0b63aeaddc # v1.1.0
        with:
          version: 0.13.0
      - name: Plugin tests
        run: ${{ matrix.cli }} test -m benchmark
      - name: JVM smoke
        run: ${{ matrix.cli }} do benchmarkSmoke -m jvm
      - name: Host Native smoke
        run: ${{ matrix.cli }} do benchmarkSmoke -m ${{ matrix.native }}
      - name: Verify reports
        run: python scripts/verify-reports.py jvm ${{ matrix.native }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: benchmark-${{ matrix.os }}
          path: |
            build/tasks/*/results.json
            build/tasks/*/run.json
            build/reports/
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Heapy/setup-ktc@cc63216665ce07ce0709fe52ef4a4b0b63aeaddc # v1.1.0
        with:
          version: 0.13.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: ./kotlin do benchmarkSmoke -m js
      - run: ./kotlin do benchmarkSmoke -m wasm-js
      - run: ./kotlin do benchmarkSmoke -m wasm-wasi
      - run: python3 scripts/verify-reports.py js wasm-js wasm-wasi
      - name: Verify failure handling and source installation
        run: python3 scripts/test-integration.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: benchmark-web
          path: |
            build/tasks/*/results.json
            build/tasks/*/run.json
