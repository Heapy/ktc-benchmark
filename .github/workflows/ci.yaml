name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            native: linux
            cli: ./kotlin
          - os: macos-latest
            native: macos
            cli: ./kotlin
          - os: windows-latest
            native: windows
            cli: ./kotlin.bat
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Heapy/setup-main-kts@b0858237748f325b825e752bbac2ec2eb1fb9419 # v1.0.1
        with:
          kotlin-version: '2.4.21'
          kotlin-sha256: '7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd'
          java-version: '25'
          distribution: temurin
      - uses: Heapy/setup-ktc@e0a603c477110083db0b44f302deb188d4991ea0 # v1.1.0
        with:
          version: 0.13.0
      - name: Plugin tests
        run: ${{ matrix.cli }} test -m benchmark
      - name: JVM smoke
        run: ${{ matrix.cli }} do benchmarkSmoke -m jvm
      - name: Host Native smoke
        run: ${{ matrix.cli }} do benchmarkSmoke -m ${{ matrix.native }}
      - name: Verify reports
        run: kotlinr scripts/verify-reports.main.kts jvm ${{ matrix.native }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: benchmark-${{ matrix.os }}
          path: |
            build/tasks/*/results.json
            build/tasks/*/run.json
            build/reports/
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Heapy/setup-main-kts@b0858237748f325b825e752bbac2ec2eb1fb9419 # v1.0.1
        with:
          kotlin-version: '2.4.21'
          kotlin-sha256: '7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd'
          java-version: '25'
          distribution: temurin
      - uses: Heapy/setup-ktc@e0a603c477110083db0b44f302deb188d4991ea0 # v1.1.0
        with:
          version: 0.13.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: ./kotlin do benchmarkSmoke -m js
      - run: ./kotlin do benchmarkSmoke -m wasm-js
      - run: ./kotlin do benchmarkSmoke -m wasm-wasi
      - run: kotlinr scripts/verify-reports.main.kts js wasm-js wasm-wasi
      - name: Verify failure handling and source installation
        run: kotlinr scripts/test-integration.main.kts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: benchmark-web
          path: |
            build/tasks/*/results.json
            build/tasks/*/run.json
